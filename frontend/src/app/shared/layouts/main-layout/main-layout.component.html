<div class="d-flex min-vh-100 app-shell">
  <app-sidebar [isOpen]="sidebarOpen" (closeSidebar)="closeSidebar()" />

  @if (sidebarOpen) {
    <div class="sidebar-backdrop d-lg-none" (click)="closeSidebar()"></div>
  }

  <div class="flex-grow-1 d-flex flex-column min-w-0">
    <app-navbar
      portalTitle="Training Institute Course & Batch Management"
      (toggleSidebar)="toggleSidebar()"
    />

    <main class="flex-grow-1 p-3 p-lg-4">
      <div class="container-fluid px-0">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
