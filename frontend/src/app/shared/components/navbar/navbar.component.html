<header class="navbar navbar-expand bg-white border-bottom px-3 px-lg-4 py-2 sticky-top app-navbar">
  <div class="d-flex align-items-center gap-3 w-100 justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm d-lg-none"
        aria-label="Toggle navigation menu"
        (click)="onToggleSidebar()"
      >
        <i class="bi bi-list fs-5"></i>
      </button>
      <span class="fw-semibold text-dark fs-6">{{ portalTitle }}</span>
    </div>

    <div class="d-flex align-items-center gap-3 text-muted small">
      <span class="d-none sm:inline-flex d-sm-inline-flex align-items-center gap-1">
        <i class="bi bi-calendar3"></i>
        <span>{{ todayLabel }}</span>
      </span>
      <span class="badge text-bg-light border text-secondary fw-medium">
        <i class="bi bi-building me-1"></i>Institute Operations
      </span>
    </div>
  </div>
</header>
